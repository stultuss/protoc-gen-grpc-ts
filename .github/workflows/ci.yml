name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The unit tests run the compiled plugin directly and do not need the
      # grpc-tools binaries, so skip the postinstall download (avoids depending
      # on node-precompiled-binaries.grpc.io in CI).
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test

  # Full install (scripts enabled): downloads the bundled protoc +
  # grpc_node_plugin binaries from the grpc.io host and verifies their sha512
  # checksums, then runs the generator against the real toolchain. This
  # exercises the distribution channel the test job deliberately skips.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and bundled binaries
        run: npm ci
      - name: Verify bundled protoc version
        run: |
          ./bin/protoc --version
          ./bin/protoc --version | grep -q 'libprotoc 3.19.1'
      - name: Differential test against real protoc output
        run: npm run test:differential
      - name: Wrapper end-to-end (success path)
        run: |
          rm -rf e2e-out
          mkdir -p e2e-out
          node ./bin/protoc-gen-grpc.js \
            --js_out=import_style=commonjs,binary:./e2e-out \
            --grpc_out=grpc_js:./e2e-out \
            --proto_path test/differential/proto \
            test/differential/proto/product.proto
          node ./bin/protoc-gen-grpc-ts.js \
            --ts_out=./e2e-out \
            --proto_path test/differential/proto \
            test/differential/proto/product.proto
          test -f e2e-out/product_pb.js
          test -f e2e-out/product_grpc_pb.js
          test -f e2e-out/product_pb.d.ts
          test -f e2e-out/product_grpc_pb.d.ts
      - name: Wrapper failure path propagates protoc errors
        run: |
          if node ./bin/protoc-gen-grpc-ts.js \
              --ts_out=./e2e-out \
              --proto_path test/differential/proto \
              test/differential/proto/missing.proto 2>e2e-err.txt; then
            echo "expected protoc to fail but it succeeded" >&2
            exit 1
          fi
          grep -q 'No such file or directory' e2e-err.txt
