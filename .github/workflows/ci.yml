name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The unit tests run the compiled plugin directly and do not need the
      # grpc-tools binaries, so skip the postinstall download (avoids depending
      # on node-precompiled-binaries.grpc.io in CI).
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
